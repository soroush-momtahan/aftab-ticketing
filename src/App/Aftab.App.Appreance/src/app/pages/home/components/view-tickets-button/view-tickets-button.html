<a
  [routerLink]="link()"
  class="group relative inline-flex items-center justify-center gap-3
             overflow-hidden rounded-full px-10 py-4
             text-base font-semibold tracking-wide text-[#0a0a0a]
             transition-all duration-300 ease-out
             focus-visible:outline-none focus-visible:ring-2
             focus-visible:ring-[#e3ab1c] focus-visible:ring-offset-2
             focus-visible:ring-offset-[#0a0a0a]
             active:scale-[0.97]"
  [class.scale-105]="isHovered()"
  (mouseenter)="isHovered.set(true)"
  (mouseleave)="isHovered.set(false); isPressed.set(false)"
  (mousedown)="isPressed.set(true)"
  (mouseup)="isPressed.set(false)"
>
  <!-- Metallic gold gradient -->
  <span
    class="absolute inset-0 rounded-full
               bg-gradient-to-b from-[#f4dda4] via-[#e3ab1c] to-[#b68816]
               transition-all duration-300
               group-hover:from-[#f9eed2] group-hover:via-[#e9bb49] group-hover:to-[#e3ab1c]"
  ></span>

  <!-- Subtle glass edge -->
  <span
    class="absolute inset-[1px] rounded-full
               bg-gradient-to-b from-white/25 to-transparent opacity-60"
  ></span>

  <!-- Soft outer glow on hover -->
  <span
    class="absolute -inset-1 rounded-full bg-[#e3ab1c]/30 blur-xl
               opacity-0 transition-opacity duration-500
               group-hover:opacity-100"
  ></span>

  <!-- Content -->
  <span class="relative z-10 flex items-center gap-2.5">
        <svg
          class="h-5 w-5 transition-transform duration-300 group-hover:-translate-y-0.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"
          />
        </svg>
    {{ label() }}
      </span>
</a>
